name: Deploy Website to GitHub Pages

on:
  push:
    tags:
      - 'dv*'
    # Temporary while the docsite PR is in review, so the preview at
    # bloxbean.github.io/cardano-client-bindings stays current; remove the
    # branch trigger after merge (dv* tags / manual dispatch take over).
    branches:
      - feature/docsite
    paths:
      - 'website/**'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "./website/package-lock.json"

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Build website
        # Base path derived from the repository name, so GitHub Pages links survive a repo
        # rename without touching the Astro config.
        run: |
          cd website
          DOCS_BASE="/${GITHUB_REPOSITORY#*/}" npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
