name: Publish npm packages

# Publishes the per-platform npm packages (@bloxbean/mesmo-<platform>) plus the main
# @bloxbean/mesmo package (see docs/adr/0012) on a v* tag via npm trusted publishing
# (OIDC, no token secret). The build/validation jobs live in build-js-packages.yml (run on PRs by
# publish-js-dry-run.yml); workflow_dispatch runs them here as a manual dry run (artifacts only,
# publish skipped).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-js-packages.yml
    with:
      # The publish job downloads these AFTER the `release` approval, so they must outlive a
      # human gate. PR dry runs keep the workflow's short default instead. Must stay <= the
      # repository's artifact retention setting (currently 7 days) or it is silently clamped.
      retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Final human gate before the irreversible npm publish: the job pauses until a required reviewer
    # of the `release` environment approves (configured in repo settings). See RELEASING.md.
    environment: release
    # Trusted publishing: npm exchanges the GitHub OIDC token for publish credentials — no
    # npm token secret. Requires npm >= 11.5.1 and node >= 22.14. The publish commands must
    # stay in THIS file: npm's trusted publisher validates the top-level workflow filename.
    permissions:
      contents: read
      id-token: write
    env:
      PKG_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          pattern: npmpkg-*
          merge-multiple: true
          path: dist
      - name: Unpack platform packages
        run: |
          set -eux
          for t in dist/platform-*.tgz; do
            d="pkgs/$(basename "$t" .tgz)"
            mkdir -p "$d"
            tar xzf "$t" -C "$d" --strip-components=1
          done
      # This job publishes from its own checkout, so stamp the version here too (the build
      # workflow stamped its own copy only).
      - name: Set package version from gradle.properties
        run: node wrappers/js/scripts/set-package-version.mjs "$PKG_VERSION"

      # Publish only on a tag (workflow_dispatch stays a dry run). Platform packages first, then
      # the main package (so its optionalDependencies already exist). Pre-1.0 the `-preN` line IS
      # the release, so it takes `latest`; `beta`/`rc` builds get their own dist-tag.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          rm -f wrappers/js/libs/libmesmo.*
          NPM_TAG=latest
          case "$PKG_VERSION" in
            *-beta*) NPM_TAG=beta ;;
            *-rc*)   NPM_TAG=next ;;
            # Pre-1.0 there is no stable line, so `-preN` is what a bare `npm install` has to
            # resolve to: npm resolves a bare install through the `latest` tag only, and npmjs.com
            # renders the `latest` version's README. Tagging these `preview` would strand `latest`
            # on the 0.0.0-oidc-bootstrap.0 trusted-publishing placeholder. Revert this arm to
            # NPM_TAG=preview at 1.0.0, so prereleases stop displacing the stable release.
            *-preview*|*-pre*|*-alpha*) NPM_TAG=latest ;;
          esac
          # Leading ./ is required: npm reads a bare "pkgs/platform-x" as the github:owner/repo
          # shorthand and tries to git-fetch it, instead of publishing the local directory.
          for d in pkgs/platform-*; do npm publish "./$d" --access public --provenance --tag "$NPM_TAG"; done
          npm publish ./wrappers/js --access public --provenance --tag "$NPM_TAG"
