name: Portable Linux lib (glibc baseline)

# Guards the distro-portability of the shipped libmesmo.so on both Linux arches. native-image can't emit
# a static library (oracle/graal#3053), so portability is achieved by building the .so against an OLD
# glibc baseline: inside manylinux_2_28 the resulting lib references no symbol newer than GLIBC_2.17, so
# it runs on RHEL/CentOS 7+, Amazon Linux 2, Ubuntu 18.04+, Debian 9+ and every newer distro. See
# docs/adr/0008-linux-glibc-baseline-portability.md. This builds it (x86_64 + aarch64), asserts the glibc
# floor, and proves it actually runs on glibc 2.17 (centos:7) — catching any regression that pulls in a
# newer symbol.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  glibc-baseline:
    name: Build libmesmo.so (${{ matrix.arch }}, manylinux_2_28)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            graalvm_url: https://gds.oracle.com/download/graal/25i3/latest/graalvm-jdk-25i3-25_linux-x64_bin.tar.gz
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            graalvm_url: https://gds.oracle.com/download/graal/25i3/latest/graalvm-jdk-25i3-25_linux-aarch64_bin.tar.gz
    container:
      image: ${{ matrix.image }}
    env:
      GRAALVM_URL: ${{ matrix.graalvm_url }}
      # The guarantee: the .so must require no glibc symbol newer than the builder's glibc (2.28).
      # (In practice native-image tops out at 2.17 — the centos:7 job below enforces that strictly.)
      BASELINE: "2.28"
    steps:
      - uses: actions/checkout@v4

      - name: Show build-container glibc
        run: ldd --version | head -1

      - name: Ensure build prerequisites (gcc toolset, zlib headers)
        run: |
          set -eux
          gcc --version | head -1 || dnf install -y gcc
          dnf install -y zlib-devel || true

      - name: Install Oracle GraalVM 25.3
        run: |
          set -eux
          mkdir -p /opt/graalvm
          curl -fsSL -o /tmp/graalvm.tar.gz "$GRAALVM_URL"
          tar xzf /tmp/graalvm.tar.gz -C /opt/graalvm --strip-components=1
          echo "JAVA_HOME=/opt/graalvm" >> "$GITHUB_ENV"
          echo "/opt/graalvm/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          set -eux
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/native-image" --version

      - name: Build native library
        run: ./gradlew :core:nativeCompile --no-daemon --stacktrace

      - name: Assert glibc floor (<= 2.28)
        run: |
          set -eux
          SO=core/build/native/nativeCompile/libmesmo.so
          test -f "$SO"
          objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -uV > /tmp/syms.txt
          echo "---- GLIBC symbol versions required ----"; cat /tmp/syms.txt
          MAX=$(sed 's/GLIBC_//' /tmp/syms.txt | sort -V | tail -1)
          echo "---- Max required: GLIBC_$MAX (guarantee: <= $BASELINE) ----"
          HIGHER=$(printf '%s\n%s\n' "$MAX" "$BASELINE" | sort -V | tail -1)
          if [ "$HIGHER" != "$BASELINE" ]; then
            echo "FAIL: libmesmo.so requires GLIBC_$MAX, newer than baseline GLIBC_$BASELINE"
            exit 1
          fi
          echo "PASS: libmesmo.so runs on any system with glibc >= $MAX"

      - name: Compile the smoke harness against libmesmo.so
        run: |
          set -eux
          ND=core/build/native/nativeCompile
          gcc native-test/src/smoke.c -I"$ND" -L"$ND" -lmesmo -Wl,-rpath,'$ORIGIN' -o "$ND/smoke"

      - name: Stage runnable artifact (lib + harness together)
        run: |
          set -eux
          mkdir -p dist
          cp core/build/native/nativeCompile/libmesmo.so dist/
          cp core/build/native/nativeCompile/smoke dist/

      - uses: actions/upload-artifact@v4
        with:
          name: libmesmo-glibc-baseline-${{ matrix.arch }}
          path: dist/

  run-on-old-distro:
    name: Run libmesmo.so on glibc 2.17 (centos:7, ${{ matrix.arch }})
    needs: glibc-baseline
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmesmo-glibc-baseline-${{ matrix.arch }}
          path: dist

      # Run the prebuilt binary inside centos:7 (glibc 2.17) WITHOUT installing anything. This is a
      # strict run-on-2.17 guard: if some change pushes the required glibc above 2.17, the loader
      # here fails. We don't use a `container:` for the job because GitHub's node-based actions can't
      # run inside glibc 2.17; `docker run` keeps the actions on the modern runner. centos:7 is
      # multi-arch, so on the aarch64 runner it pulls the aarch64 variant.
      - name: Load + run on centos:7
        run: |
          set -eux
          chmod +x dist/smoke
          docker run --rm -v "$PWD/dist:/work" -w /work centos:7 bash -c '
            set -eux
            ldd --version | head -1
            echo "---- libmesmo.so shared-lib deps on this host ----"
            ldd ./libmesmo.so
            echo "---- running harness ----"
            ./smoke
          '
