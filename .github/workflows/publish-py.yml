name: Publish Python wheels

# Publishes the platform wheels (one per supported target, each bundling that platform's libmesmo.*,
# see docs/adr/0012-native-lib-bundled-in-wrapper-packages.md) to PyPI on a v* tag via PyPI trusted
# publishing (OIDC — no API token secret). The build/validation jobs live in build-py-wheels.yml (run
# on PRs by publish-py-dry-run.yml); workflow_dispatch runs them here as a manual dry run (artifacts
# only, publish skipped).
#
# The wheels are also attached to the GitHub release, so `pip install <url>` keeps working without
# PyPI.
#
# The publish step must stay in THIS file: PyPI's trusted publisher matches on the top-level workflow
# filename (publish-py.yml) plus the environment (release). Renaming this file or the environment
# breaks the OIDC exchange until the publisher is re-registered on PyPI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-py-wheels.yml
    with:
      # The publish job downloads these AFTER the `release` approval, so they must outlive a
      # human gate. PR dry runs keep the workflow's short default instead. Must stay <= the
      # repository's artifact retention setting (currently 7 days) or it is silently clamped.
      retention-days: 5

  # Attach the wheels to the GitHub release. Deliberately NOT behind the `release` environment: a
  # release asset can be replaced or deleted, so it needs no last-chance approval, and this way the
  # wheels are downloadable even if the PyPI publish is declined or fails.
  attach:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # attach wheels to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List collected wheels
        run: ls -la dist
      - name: Attach wheels to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  publish:
    needs: build
    # Job-level, not step-level: the `release` approval fires when the job *starts*, so gating only
    # the final step would make a workflow_dispatch dry run page a release code owner to approve a
    # job that then skips the actual publish.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # Final human gate before the irreversible PyPI publish (a released file can be deleted, but its
    # filename can never be reused, and a deleted version can never be re-uploaded): the job pauses
    # until a required reviewer of the `release` environment approves. See RELEASING.md.
    environment: release
    # Trusted publishing: PyPI exchanges the GitHub OIDC token for a short-lived upload token — no
    # PYPI_API_TOKEN secret. Configure the trusted publisher on PyPI against this repo, this
    # workflow filename, and the `release` environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List collected wheels
        run: ls -la dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # All wheels upload in one call, and a PyPI filename can never be reused. If an upload
          # fails part-way, this lets the retry skip what already landed instead of erroring on it.
          skip-existing: true
